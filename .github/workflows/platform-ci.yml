name: RESQ Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Test Platform Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Submodules Anonymously
        run: |
          git -c http.extraheader="" submodule update --init --recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build & Test Multi-Module Platform Services
        run: mvn clean test -Dspring.classformat.ignore=true

      - name: Authenticate to Google Cloud via WIF
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/resq-enterprise-cloud-01/locations/global/workloadIdentityPools/resq-github-pool/providers/resq-github-provider'
          service_account: 'resq-cicd-deployer@resq-enterprise-cloud-01.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
